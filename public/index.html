<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <!-- Nur eigene Dateien. Die Kasse lädt nichts aus dem Netz — auch dann
         nicht, wenn sie könnte: Auf dem Fest soll sie genauso aussehen. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
    <title>Zero1 checkout</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="kasse">
      <header class="topbar">
        <div class="brand">
          <img src="img/tv-fridingen.png" alt="">
          <h1>Kasse<small id="club">Turnverein 1905 Fridingen e. V.</small></h1>
        </div>
        <span id="device" class="device" hidden></span>
        <div class="spacer"></div>
        <button id="sync-pill" class="sync-pill" type="button" data-state="neu" title="Jetzt abgleichen (F9)">
          <span class="dot"></span>
          <span id="sync-text">Wird geladen…</span>
          <span id="sync-pending" class="pending" hidden></span>
        </button>
        <button id="open-settings" class="icon-button" type="button" title="Einstellungen (Strg+,)"><i class="fas fa-cog"></i></button>
      </header>

      <div id="banner" class="banner" hidden>
        <span id="banner-text"></span>
        <button id="banner-action" class="btn-kasse quiet" type="button">Einstellungen öffnen</button>
      </div>

      <main class="workspace">
        <div class="panel">
          <div class="empty-state">
            <img src="img/tv-fridingen.png" alt="">
            <h2>Die Kasse ist bereit</h2>
            <p>Artikel, Veranstaltungen und der Verkauf folgen im nächsten Schritt. Kopplung, Abgleich und Aktualisierung laufen bereits.</p>
          </div>
        </div>
      </main>

      <footer class="footer">
        <span id="footer-sync"></span>
        <span class="spacer"></span>
        <span id="footer-version"></span>
      </footer>
    </div>

    <div id="toasts" class="toasts"></div>

    <script src="js/common.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
